name: Verify Personal Harness v0.1.0-alpha.2 packages

on:
  push:
    branches: [ci/verify-v0.1.0-alpha.2]

permissions: {}

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            asset: Personal-Harness-Windows-x64.zip
            digest: 1e2230e49c10cea48fa90b5fab6c2bf88dcfd44d5e939f69f0fb0dd9e54433e2
          - name: Intel Mac
            runner: macos-15-intel
            asset: Personal-Harness-macOS.zip
            digest: 75e7117e3fd3f4494056312eff1c150b453d4650f7adde1d5c90021cda6e1df0

    steps:
      - name: Verify published ZIP, offline demo, and approval
        shell: python
        env:
          ASSET: ${{ matrix.asset }}
          SHA256: ${{ matrix.digest }}
        run: |
          import hashlib
          import json
          import os
          import platform
          import plistlib
          import re
          import shutil
          import subprocess
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path

          WINDOWS = os.name == "nt"
          VERSION = "3.14.10"
          URL = "https://github.com/haidaitoubaba/personal-harness/releases/download/v0.1.0-alpha.2/"

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def run(args, cwd, env, *, input_text=None, expected=0):
              result = subprocess.run(
                  args, cwd=cwd, env=env, input=input_text, capture_output=True,
                  encoding="utf-8", errors="replace", timeout=60,
              )
              require(
                  result.returncode == expected,
                  f"{args!r} exited {result.returncode}, expected {expected}\n"
                  f"stdout:\n{result.stdout}\nstderr:\n{result.stderr}",
              )
              return result.stdout

          machine = platform.machine().lower()
          require(platform.system() == ("Windows" if WINDOWS else "Darwin"), platform.system())
          require(machine == ("amd64" if WINDOWS else "x86_64"), f"Unexpected runner architecture: {machine}")
          if not WINDOWS:
              translated = subprocess.run(
                  ["/usr/sbin/sysctl", "-in", "sysctl.proc_translated"], capture_output=True, text=True,
              ).stdout.strip()
              require(translated != "1", "The macOS process is under Rosetta.")
          print(f"Runner: {platform.system()} {platform.release()} {machine}", flush=True)

          with tempfile.TemporaryDirectory(prefix="Harness release ", dir=os.environ["RUNNER_TEMP"]) as directory:
              root = Path(directory)
              archive = root / os.environ["ASSET"]
              with urllib.request.urlopen(URL + archive.name, timeout=60) as response, archive.open("wb") as target:
                  shutil.copyfileobj(response, target)
              with archive.open("rb") as stream:
                  digest = hashlib.sha256(stream.read()).hexdigest()
              require(digest == os.environ["SHA256"], f"Unexpected SHA-256: {digest}")
              print(f"Verified SHA-256 {digest} for {archive.name}", flush=True)

              env = dict(os.environ)
              for key in tuple(env):
                  if key.startswith(("PYTHON", "DYLD_")):
                      env.pop(key)
              if WINDOWS:
                  with zipfile.ZipFile(archive) as package:
                      package.extractall(root)
                  system = Path(env["SystemRoot"])
                  env["PATH"] = os.pathsep.join(map(str, [system / "System32", system]))
                  cmd = system / "System32/cmd.exe"
              else:
                  subprocess.run(["/usr/bin/ditto", "-x", "-k", archive, root], check=True, timeout=60)
                  env["PATH"] = "/usr/bin:/bin"

              bundle = root / "Personal Harness"
              if WINDOWS:
                  probe = run([bundle / "runtime/python.exe", "-B", "-c",
                               "import platform, sqlite3; print(platform.python_version()); print(platform.machine().lower())"],
                              bundle, env).splitlines()
                  require(probe == [VERSION, "amd64"], f"Unexpected bundled Windows Python: {probe}")
                  launcher = [cmd, "/d", "/c", "call", "Start Harness.cmd"]
                  cli = [cmd, "/d", "/c", "harness.cmd"]
              else:
                  info = bundle / "runtime/_internal/Python.framework/Versions/3.14/Resources/Info.plist"
                  with info.open("rb") as stream:
                      require(plistlib.load(stream)["CFBundleVersion"] == VERSION, "Unexpected bundled macOS Python")
                  launcher = [bundle / "Start Harness.command"]
                  cli = [bundle / "harness"]
              print(f"Bundled Python {VERSION} confirmed", flush=True)

              def invoke(*args, expected=0):
                  return run([*cli, *args], bundle, env, expected=expected)

              def report(*args, expected=0):
                  return json.loads(invoke(*args, expected=expected))

              demo = run(launcher, bundle, env, input_text="\ny\n\n")
              print(demo, flush=True)
              require("Draft: Sample metadata review is complete." in demo, "Demo did not produce the sample draft")
              require("Status: succeeded" in demo, "Demo did not show success after approval")
              recorded_run = re.search(r"(?m)^Run: ([0-9a-f]{32})$", demo)
              require(recorded_run is not None, "Demo did not report its run ID")
              require(report("status", recorded_run.group(1))["status"] == "succeeded", "Demo success was not persisted")

              definition = os.path.join("examples", "research-briefing.json")
              require(report("validate", definition)["valid"], "Packaged sample did not validate")
              for decision, status, exit_code, decision_event in (
                  ("approve", "succeeded", 0, "approval_granted"),
                  ("reject", "rejected", 1, "approval_rejected"),
              ):
                  run_id = report("start", definition)["run_id"]
                  waiting = report("resume", run_id)
                  require(waiting["status"] == "waiting_for_approval" and waiting["current_step"] == "review_briefing",
                          f"Unexpected approval gate: {waiting}")
                  require(report(decision, run_id, "review_briefing", expected=exit_code)["status"] == status,
                          f"{decision} did not produce {status}")
                  require(report("status", run_id)["status"] == status, f"{status} was not persisted")
                  kinds = {json.loads(line)["kind"] for line in invoke("events", run_id).splitlines()}
                  require({"approval_requested", decision_event} <= kinds and ("run_succeeded" in kinds) == (exit_code == 0),
                          f"Unexpected events for {decision}: {sorted(kinds)}")
                  print(f"CLI approval gate -> {decision} -> {status} (persisted)", flush=True)
